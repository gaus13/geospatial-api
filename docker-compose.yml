services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geospatial
      POSTGRES_USER: geo_user
      POSTGRES_PASSWORD: geo_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_user -d geospatial"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://geo_user:geo_password@db:5432/geospatial
      TEST_DATABASE_URL: postgresql+psycopg2://geo_user:geo_password@db:5432/geospatial
      MAX_UPLOAD_MB: 50
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
